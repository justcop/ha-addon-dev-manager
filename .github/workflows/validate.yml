name: Validate controller
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r addon_dev_manager/requirements.txt pytest==8.4.2
      - run: python -m pytest -q
      - run: node --check addon_dev_manager/manager/static/app.js
      - run: docker build --build-arg BUILD_VERSION=0.2.7 --build-arg BUILD_ARCH=amd64 -t addon-dev-manager:test addon_dev_manager
