name: Add-on Development Manager
version: "0.2.9"
slug: addon_dev_manager
description: Deploy GitHub commits to local add-ons and manage their lifecycle.
url: https://github.com/justcop/ha-addon-dev-manager
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:tools
panel_title: Development Manager
panel_admin: true
hassio_api: true
hassio_role: admin
map:
  - type: addons
    read_only: false
backup: cold
stage: experimental
options:
  automatic_updates: true
  check_interval: 60
  update_on_start: true
  github_token: ""
  stop_timeout: 60
  health_timeout: 120
  repositories: []
schema:
  automatic_updates: bool
  check_interval: int(15,86400)
  update_on_start: bool
  github_token: password
  stop_timeout: int(10,300)
  health_timeout: int(15,600)
  repositories:
    - id: match(^[a-z][a-z0-9_]{0,39}$)
      repository: str
      branch: str
      path: str
      enabled: bool
      update_on_start: bool
      health_port: int(0,65535)
      health_path: str
